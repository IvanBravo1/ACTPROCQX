<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de equipo – Planta quirúrgica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1f5c4d;
    --verde-oscuro: #15443a;
    --fondo: #eef3f1;
    --papel: #ffffff;
    --tinta: #1b2a26;
    --suave: #5b6f68;
    --ambar: #b4580a;
    --ambar-oscuro: #8f4608;
    --borde: #cfdcd7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--tinta);
    line-height: 1.5;
    min-height: 100vh;
  }
  .contenedor { max-width: 480px; margin: 0 auto; padding: 0 0 32px; }
  header { background: var(--verde); color: #fff; padding: 28px 22px 26px; }
  header p { margin: 0 0 6px; font-size: 0.95rem; opacity: 0.85; }
  header h1 { margin: 0 0 10px; font-size: 1.9rem; line-height: 1.15; font-weight: 700; }
  .codigo {
    display: inline-block; padding: 3px 10px;
    border: 1.5px solid rgba(255,255,255,0.6); border-radius: 4px; font-size: 0.95rem;
  }
  main { padding: 22px 18px 0; display: grid; gap: 14px; }
  .boton {
    display: block; width: 100%; padding: 20px 18px; border: 0; border-radius: 8px;
    font: inherit; font-size: 1.25rem; font-weight: 700; text-align: left;
    text-decoration: none; color: #fff; cursor: pointer;
  }
  .boton small { display: block; font-size: 0.95rem; font-weight: 400; opacity: 0.9; margin-top: 2px; }
  .boton-info { background: var(--verde); }
  .boton-info:hover { background: var(--verde-oscuro); }
  .boton-falla { background: var(--ambar); }
  .boton-falla:hover { background: var(--ambar-oscuro); }
  .boton:focus-visible { outline: 3px solid #0b2a22; outline-offset: 3px; }
  .panel { background: var(--papel); border: 1.5px solid var(--borde); border-radius: 8px; padding: 18px; }
  .panel[hidden] { display: none; }
  .panel h2 { margin: 0 0 4px; font-size: 1rem; font-weight: 400; color: var(--suave); }
  .fecha { margin: 0; font-size: 2rem; font-weight: 700; line-height: 1.2; }
  .ultimo { margin: 8px 0 0; color: var(--suave); }
  .estado { margin: 10px 0 0; padding-left: 12px; border-left: 4px solid var(--verde); font-size: 1.05rem; }
  .estado.atencion { border-left-color: var(--ambar); }
  .estado.vencido { border-left-color: #a31b1b; color: #a31b1b; font-weight: 700; }
  .mensaje { margin: 0; font-size: 1.05rem; }
  footer { padding: 22px 22px 0; font-size: 0.9rem; color: var(--suave); }
  @media (prefers-reduced-motion: no-preference) { .boton { transition: background-color 0.15s; } }
</style>
</head>
<body>
<div class="contenedor">

  <header>
    <p>Planta quirúrgica</p>
    <h1 id="nombre-equipo">Cargando equipo…</h1>
    <span class="codigo" id="codigo-equipo" hidden></span>
  </header>

  <main>
    <button class="boton boton-info" id="btn-info" type="button" aria-expanded="false" aria-controls="panel-service">
      Ver próximo service
      <small>Fecha de la próxima revisión</small>
    </button>

    <section class="panel" id="panel-service" hidden aria-live="polite">
      <h2>Próximo service</h2>
      <p class="fecha" id="fecha-service"></p>
      <p class="ultimo" id="ultimo-service" hidden></p>
      <p class="estado" id="estado-service" hidden></p>
      <p class="mensaje" id="mensaje" hidden></p>
    </section>

    <a class="boton boton-falla" id="btn-falla" href="#">
      Reportar una falla
      <small>Se completa en menos de un minuto</small>
    </a>
  </main>

  <footer>
    Si el equipo tiene una falla que afecta la seguridad del paciente, no lo uses y avisá al jefe de quirófano.
  </footer>

</div>

<script>
  /* ===== CONFIGURACIÓN: editá solo estas tres líneas ===== */

  // Enlace CSV de tu hoja (Archivo > Compartir > Publicar en la web > formato CSV)
  var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5Os6eSeHnVpupeDVUuNInPCRvHa7u5rdSSkjzMMvvkRzprjDAlmoaXPi2kOcX-YS90GiBOeGdxUpI/pub?gid=0&single=true&output=csv";

  // Enlace de tu Google Forms
  var FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSedDNfl94P5HBmWaho_P3zgSPqsVMXZxv4daoIlLhjbe5suDw/viewform?usp=publish-editor";

  // Opcional: código del campo "Equipo" del formulario prellenado (ej: "entry.1234567890").
  // Si lo dejás vacío, el formulario se abre sin equipo precargado.
  var FORM_ENTRY = "";

  /* ======================================================= */

  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var codigo = (params.get('id') || '').trim();

  // Botón de falla: enlace al formulario (con el equipo precargado si se configuró)
  (function () {
    var url = FORM_URL;
    if (FORM_ENTRY && codigo) {
      url += (url.indexOf('?') === -1 ? '?' : '&') + encodeURIComponent(FORM_ENTRY) + '=' + encodeURIComponent(codigo);
    }
    $('btn-falla').href = url;
  })();

  // Mostrar u ocultar el panel del service
  $('btn-info').addEventListener('click', function () {
    var abierto = !$('panel-service').hidden;
    $('panel-service').hidden = abierto;
    $('btn-info').setAttribute('aria-expanded', String(!abierto));
  });

  function mensaje(texto) {
    $('fecha-service').hidden = true;
    $('mensaje').textContent = texto;
    $('mensaje').hidden = false;
  }

  function normalizar(t) {
    return (t || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  // Lector simple de CSV (admite comillas)
  function leerCSV(texto) {
    var filas = [], fila = [], campo = '', comillas = false;
    for (var i = 0; i < texto.length; i++) {
      var c = texto[i];
      if (comillas) {
        if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
        else if (c === '"') { comillas = false; }
        else { campo += c; }
      } else if (c === '"') { comillas = true; }
      else if (c === ',') { fila.push(campo); campo = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && texto[i + 1] === '\n') i++;
        fila.push(campo); filas.push(fila); fila = []; campo = '';
      } else { campo += c; }
    }
    if (campo !== '' || fila.length) { fila.push(campo); filas.push(fila); }
    return filas;
  }

  // Acepta 15/02/2027 o 2027-02-15
  function leerFecha(t) {
    t = (t || '').trim();
    var m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    return null;
  }

  function formato(f) {
    return f.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function mostrar(equipo, fechaTexto, ultimoTexto) {
    $('nombre-equipo').textContent = equipo || codigo;
    $('codigo-equipo').textContent = codigo;
    $('codigo-equipo').hidden = false;

    var fecha = leerFecha(fechaTexto);
    if (!fecha) { mensaje('Este equipo todavía no tiene una fecha de service cargada.'); return; }

    $('fecha-service').textContent = formato(fecha);

    var ultimo = leerFecha(ultimoTexto);
    if (ultimo) {
      $('ultimo-service').textContent = 'Último service: ' + formato(ultimo);
      $('ultimo-service').hidden = false;
    }

    var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    var dias = Math.round((fecha - hoy) / 86400000);
    var e = $('estado-service');
    e.hidden = false;
    if (dias < 0) {
      var d = Math.abs(dias);
      e.textContent = 'Service vencido hace ' + d + (d === 1 ? ' día' : ' días') + '. Avisá a mantenimiento.';
      e.className = 'estado vencido';
    } else if (dias === 0) {
      e.textContent = 'El service es hoy.';
      e.className = 'estado atencion';
    } else if (dias <= 30) {
      e.textContent = 'Faltan ' + dias + (dias === 1 ? ' día' : ' días') + '.';
      e.className = 'estado atencion';
    } else {
      e.textContent = 'Faltan ' + dias + ' días.';
      e.className = 'estado';
    }
  }

  // Cargar datos desde la hoja
  if (!codigo) {
    $('nombre-equipo').textContent = 'Equipo sin identificar';
    mensaje('Escaneá el QR pegado en el equipo. El enlace debe terminar en ?id=CÓDIGO.');
  } else {
    fetch(SHEET_CSV_URL, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.text(); })
      .then(function (texto) {
        var filas = leerCSV(texto);
        var enc = filas[0].map(normalizar);
        var iCod = enc.findIndex(function (h) { return h.indexOf('codigo') !== -1; });
        var iEq = enc.findIndex(function (h) { return h.indexOf('equipo') !== -1; });
        var iProx = enc.findIndex(function (h) { return h.indexOf('proximo') !== -1; });
        var iUlt = enc.findIndex(function (h) { return h.indexOf('ultimo') !== -1; });
        if (iCod === -1 || iProx === -1) throw new Error('columnas');

        var fila = filas.slice(1).find(function (f) {
          return normalizar(f[iCod]) === normalizar(codigo);
        });
        if (!fila) {
          $('nombre-equipo').textContent = 'Equipo no encontrado';
          $('codigo-equipo').textContent = codigo;
          $('codigo-equipo').hidden = false;
          mensaje('El código ' + codigo + ' no figura en la lista de equipos. Avisá a mantenimiento.');
          return;
        }
        mostrar(iEq !== -1 ? fila[iEq] : '', fila[iProx], iUlt !== -1 ? fila[iUlt] : '');
      })
      .catch(function () {
        $('nombre-equipo').textContent = codigo;
        $('codigo-equipo').textContent = codigo;
        $('codigo-equipo').hidden = false;
        mensaje('No se pudo cargar la fecha del service. Revisá la conexión e intentá de nuevo.');
      });
  }
</script>
</body>
</html>
